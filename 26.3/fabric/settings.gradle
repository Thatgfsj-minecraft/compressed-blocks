pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// foojay-resolver：本机仅 JDK21，编译/运行 26.3 需要的 JDK25 由 toolchain 自动下载
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'compressedblocks-fabric-26.3'
