// MC 26.3 移植：26.x 线游戏去混淆，构建脚本按 FabricMC 官方 26.3 模板（fabric-example-mod）改写：
// 1) 插件 id 改为 net.fabricmc.fabric-loom；2) 不再声明 mappings（无混淆，Fabric 直接用 mojmap）；
// 3) loader/fabric-api 用 implementation（无需 intermediary remap）。
plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

loom {
    accessWidenerPath = file('src/main/resources/compressedblocks.accesswidener')
}

version = '0.3.2'
group = 'dev.compressedblocks'

base {
    archivesName = 'compressedblocks-fabric-26.3'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// 26.x 线要求 Java 25：本机仅 JDK21，gradle.properties 里 org.gradle.java.home
// 指向共享缓存中 foojay 已下载的 corretto-25，守护进程与编译都在 JDK25 上跑。
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
