plugins {
    id 'fabric-loom' version '1.17.21'
}

loom {
    accessWidenerPath = file('src/main/resources/compressedblockspot.aw')
}

version = '0.3.1'
group = 'dev.compressedblockspot'

base {
    archivesName = 'compressedblockspot-fabric-1.21.11'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    def apiRoot = '../../fabric/.gradle/loom-cache/remapped_mods/remapped/net/fabricmc/fabric-api'
    implementation files(apiRoot + '/fabric-object-builder-api-v1-4abd26ae/21.1.40+4fc5413f3e/fabric-object-builder-api-v1-4abd26ae-21.1.40+4fc5413f3e.jar')
    compileOnly files(apiRoot + '/fabric-rendering-v1-4abd26ae/16.2.10+0290ad933e/fabric-rendering-v1-4abd26ae-16.2.10+0290ad933e.jar')
    compileOnly files(apiRoot + '/fabric-lifecycle-events-v1-4abd26ae/2.6.15+4ebb5c083e/fabric-lifecycle-events-v1-4abd26ae-2.6.15+4ebb5c083e.jar')

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
