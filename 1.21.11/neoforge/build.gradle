plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '0.4.0'
group = 'dev.compressedblocks'

base {
    archivesName = 'compressedblocks-neoforge-1.21.11'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

neoForge {
    version = "${project.neoforge_version}"

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    mods {
        compressedblocks {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // 数据生成：把 CompressedFuels 规则写成 neoforge 燃料数据图（src/generated/resources）
        // MDG 2.x 的 datagen 运行类型是 serverData / clientData（没有 data）
        serverData {
            serverData()
            programArguments.addAll '--mod', 'compressedblocks', '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
    }
}

// 生成产物参与打包（runData 输出到 src/generated/resources）
sourceSets.main.resources.srcDir 'src/generated/resources'

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes(['MixinConfigs': 'compressedblocks.mixins.json'])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
