// 压缩方块 1.16.5 Forge 移植：Architectury Loom 1.6 + official mappings + Java 8 toolchain
plugins {
    id 'java-library'
    id 'dev.architectury.loom' version '1.3.358'
}

version = '0.3.0'
group = 'dev.compressedblocks'
archivesBaseName = 'compressedblocks-forge-1.16.5'

// 本机只有 JDK21：编译目标 Java 8 走 toolchain 自动下载（foojay-resolver 已在 settings.gradle 启用）
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

loom {
    forge {
    }
    runs {
        client {
            client()
            name = 'Client'
        }
        server {
            server()
            name = 'Server'
        }
    }
    mods {
        compressedblocks {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.16.5"
    // 1.16.5 official (Mojang) mappings，与 1.21.x 线一致，参考实现类名可直接对照
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:1.16.5-36.2.39"
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'compressedblocks',
            'Specification-Version': '1',
            'Implementation-Title': project.archivesBaseName,
            'Implementation-Version': project.version
        ])
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
